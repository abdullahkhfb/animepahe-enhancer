name: Deploy — Edge (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to Edge"
        required: true
        type: string

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the specified tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build extension zip
        id: zip
        uses: ./.github/actions/build-zip
        with:
          browser: chromium

      - name: Verify the zip is Chromium-only
        env:
          ZIP: ${{ steps.zip.outputs.zip-path }}
        run: |
          set -euo pipefail
          bad=$(unzip -Z1 "$ZIP" | grep -Ei '\.(zip|xpi|crx)$|manifest\.chromium\.json|firefox' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files in the Chromium zip:" >&2
            echo "$bad" >&2
            exit 1
          fi
          manifest=$(unzip -p "$ZIP" manifest.json)
          if echo "$manifest" | jq -e '.background.scripts' > /dev/null; then
            echo "manifest.json uses background.scripts; Chromium needs service_worker" >&2
            exit 1
          fi
          echo "$manifest" | jq -e '.background.service_worker' > /dev/null

      - name: Upload to Microsoft Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_CLIENT_SECRET }}
          zip-path: ${{ steps.zip.outputs.zip-path }}
