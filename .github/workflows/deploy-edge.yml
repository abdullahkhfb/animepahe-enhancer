name: Deploy — Edge (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to Edge"
        required: true
        type: string

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the specified tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build extension zip
        id: zip
        uses: ./.github/actions/build-zip
        with:
          browser: chromium

      - name: Verify the zip is Chromium-only
        env:
          ZIP: ${{ steps.zip.outputs.zip-path }}
        run: |
          set -e
          if unzip -l "$ZIP" | grep -Ei '\.(zip|xpi)$|manifest\.chromium\.json|Firefox'; then
            echo "Chromium zip contains Firefox/nested build artifacts" >&2
            exit 1
          fi
          unzip -p "$ZIP" manifest.json > /tmp/manifest.json
          grep -q '"service_worker"' /tmp/manifest.json
          if grep -q '"scripts"' /tmp/manifest.json; then
            echo "Chromium zip has the Firefox manifest" >&2
            exit 1
          fi

      - name: Upload to Microsoft Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_CLIENT_SECRET }}
          zip-path: ${{ steps.zip.outputs.zip-path }}
