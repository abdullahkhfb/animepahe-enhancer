name: Build extension zip
description: >
  Builds the store-ready extension zip. Single source of truth for what
  gets excluded (docs, screenshots, dev-only files) — used by every
  per-browser deploy workflow so the exclusion list never has to be kept
  in sync across multiple files.

  Firefox and Chromium need different `background` keys (Firefox only
  understands `background.scripts`, Chrome/Edge only `background.service_worker`
  and warn about `scripts`), so the repo keeps two manifests:
  manifest.json (Firefox) and manifest.chromium.json (Chrome / Edge). For the
  `chromium` build, the latter is packed into the zip as manifest.json.

  Built archives (*.zip, *.xpi, *.crx) are always excluded, so a zip produced
  earlier in the same job (e.g. the Firefox build) can never be swept into the
  Chromium build. The font licence text files (popup/fonts/*.txt) are also
  left out of every build; the font files themselves are still packed.

inputs:
  browser:
    description: "Target browser: firefox or chromium"
    required: false
    default: firefox

outputs:
  zip-path:
    description: Path to the built zip, relative to the repo root
    value: ${{ steps.build.outputs.zip-path }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        EXCLUDES=(-x "*.git*" ".github/*" "*.md" ".gitignore" "LICENSE" "docs/*" "screenshots/*" "manifest.chromium.json" "*.zip" "*.xpi" "*.crx" "popup/fonts/*.txt")

        if [ "$BROWSER" = "chromium" ]; then
          ZIP=Animepahe-Enhancer-Chromium.zip
          rm -f "$ZIP"
          zip -r "$ZIP" . "${EXCLUDES[@]}" -x "manifest.json"
          TMP=$(mktemp -d)
          cp manifest.chromium.json "$TMP/manifest.json"
          (cd "$TMP" && zip "$GITHUB_WORKSPACE/$ZIP" manifest.json)
        elif [ "$BROWSER" = "firefox" ]; then
          ZIP=Animepahe-Enhancer-Firefox.zip
          rm -f "$ZIP"
          zip -r "$ZIP" . "${EXCLUDES[@]}"
        else
          echo "Unknown browser: $BROWSER" >&2
          exit 1
        fi

        echo "zip-path=$ZIP" >> "$GITHUB_OUTPUT"
