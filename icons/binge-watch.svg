<svg viewBox="0 0 256 256" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bw_base_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bw_badge_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Base circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bw_base_grad)" stroke="#fff" stroke-width="4"/>
  <!-- "Skip forward" double-chevron. No drop-shadow filter: feGaussianBlur
       softens every edge, which at this icon's small display size turns
       crisp shapes into a smudge and makes it look like it doesn't fill
       its frame. Flat fills stay legible at small sizes. -->
  <path d="M56 88 L100 128 L56 168 Z" fill="#fff"/>
  <path d="M104 88 L148 128 L104 168 Z" fill="#fff"/>
  <!-- Badge: a checkmark glyph instead of the "NEXT" text label, which
       was unreadable at this icon's real display size. -->
  <circle cx="182" cy="182" r="52" fill="url(#bw_badge_grad)" stroke="#fff" stroke-width="4"/>
  <path d="M164 182 L178 196 L202 168" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
